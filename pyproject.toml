[project]
name = "test-insyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordhy-jpg", email = "177513224+Jordhy-jpg@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "markdown>=3.11.1",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
test-insyst = "test_insyst:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
]
